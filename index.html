<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>Registration</h2>
  <form action="https://www.google.com" method="">
    <p>
      <input type="text" placeholder="Enter your name" name="firstname" id="firstname" required />
    </p>
    <p>
      <input type="email" placeholder="Enter your email" name="email" id="mail" required />
    </p>
    <p>
      <input type="password" placeholder="Enter password" name="password" id="password" required />
    </p>
    <p>
      <input type="password" placeholder="Retype password" name="confirm_password" id="confirm_password" required />
    </p>
    <p>
      <input type="number" placeholder="Mobile number" name="mobile" id="mobile_number" required />
    </p>
    <p>
      <input type="radio" id="male" name="gender" />
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" />
      <label for="female">Female</label>
    </p>
    <p>
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required />
    </p>
    <p>
      <textarea name="address" id="address" placeholder="Enter addresss" required></textarea>
    </p>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
